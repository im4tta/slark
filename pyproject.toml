[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slark"
version = "0.2.0"
description = "Invisible zero-width text and PNG pixel watermarking for marking AI-generated (or any) content"
readme = "README.md"
requires-python = ">=3.8"

license = { text = "MIT" }
authors = [
    { name = "Sakha" }
]
keywords = ["watermark", "steganography", "ai-generated", "provenance", "unicode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/im4tta/slark"
Issues = "https://github.com/im4tta/slark/issues"

[project.scripts]
slark = "slark.cli:main"

[project.optional-dependencies]
image = ["pillow>=9.0"]
dev = ["pytest>=7.0", "pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["slark*"]
